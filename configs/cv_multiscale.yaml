# Multi-scale cross-validation configuration
#
# Leave-one-out cross-validation for 9 labeled images across 2 resolutions:
#   - 6 images at 2.76 µm/px (dECM, Matri)
#   - 3 images at 1.10 µm/px (GFR, Normal)
#
# Multi-scale training rescales higher-resolution images to the training
# pixel size (2.76 µm/px) and adjusts patch sampling proportionally.

# Cross-validation strategy
cv:
  strategy: leave_one_out  # 9 folds for 9 images
  source_manifest: data/splits/all.csv
  seed: 42

# Data root for resolving relative paths in manifests
data:
  data_root: data

# Dataset configuration (inherited by all folds)
dataset:
  patch_size: 256
  patches_per_image: 20
  positive_ratio: 0.7
  negative_threshold: 0.05
  max_jitter: 0.25
  max_patches_per_image: 80  # 4x patches_per_image (explicit for multi-scale)
  augmentation:
    enabled: true
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate_90: 0.5
    brightness_limit: 0.1
    contrast_limit: 0.1

# Model architecture (same for all folds)
model:
  architecture: unet
  encoder: resnet18
  encoder_weights: imagenet
  in_channels: 1  # Grayscale input
  classes: 1  # Binary segmentation
  training_pixel_size: 2.76  # Target pixel size — higher-res images rescaled to this

# Training parameters (same for all folds)
training:
  epochs: 50  # Maximum epochs (early stopping will likely trigger before this)
  batch_size: 4
  learning_rate: 0.0001  # 1e-4
  num_workers: 2
  pin_memory: true

# Loss function
loss:
  bce_weight: 0.5
  dice_weight: 0.5

# Early stopping
early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0001

# Learning rate scheduling
lr_scheduler:
  enabled: true
  mode: min
  factor: 0.5
  patience: 5
  min_lr: 0.00001  # 1e-5

# Checkpointing (per fold)
checkpointing:
  save_best: true
  save_periodic: false
  save_final: true

# TensorBoard logging (per fold)
tensorboard:
  enabled: true
  log_interval: 1
  image_interval: 10
  num_image_samples: 4

# Output configuration
output:
  cv_dir: runs/cv_multiscale

# Validation
validation:
  prediction_threshold: 0.5
