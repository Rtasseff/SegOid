# Multi-Scale Production Model Training Configuration
#
# Trains on ALL 9 labeled images across 2 resolutions for maximum data utilization:
#   - 6 images at 2.76 µm/px (dECM, Matri)
#   - 3 images at 1.10 µm/px (GFR, Normal)
#
# Higher-resolution images are rescaled to training_pixel_size (2.76 µm/px)
# and patch sampling is adjusted proportionally.
#
# Note: Uses same manifest for train and val since we're training on all available data.
# The model will be validated through human review during inference.

# Data manifests
data:
  train_manifest: data/splits/all.csv
  val_manifest: data/splits/all.csv  # Same as train - using all data
  data_root: data

# Dataset configuration
dataset:
  patch_size: 256
  patches_per_image: 30  # Increased sampling for better coverage
  positive_ratio: 0.7
  negative_threshold: 0.05
  max_jitter: 0.25
  max_patches_per_image: 120  # 4x patches_per_image (explicit for multi-scale)
  augmentation:
    enabled: true
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate_90: 0.5
    brightness_limit: 0.1
    contrast_limit: 0.1

# Model architecture
model:
  architecture: unet
  encoder: resnet18
  encoder_weights: imagenet
  in_channels: 1  # Grayscale input
  classes: 1  # Binary segmentation
  training_pixel_size: 2.76  # Target pixel size — higher-res images rescaled to this

# Training parameters
training:
  epochs: 100  # Train for more epochs with all data for best performance
  batch_size: 4
  learning_rate: 0.0001  # 1e-4
  num_workers: 2
  pin_memory: true

# Loss function
loss:
  bce_weight: 0.5
  dice_weight: 0.5

# Early stopping - DISABLED for production training
early_stopping:
  enabled: false  # Train for full epoch count

# Learning rate scheduling
lr_scheduler:
  enabled: true
  mode: min
  factor: 0.5
  patience: 8
  min_lr: 0.00001  # 1e-5

# Checkpointing
checkpointing:
  save_best: true
  save_periodic: true
  periodic_interval: 10
  save_final: true

# TensorBoard logging
tensorboard:
  enabled: true
  log_interval: 1
  image_interval: 5
  num_image_samples: 4

# Output
output:
  run_dir: runs

# Validation
validation:
  prediction_threshold: 0.5
